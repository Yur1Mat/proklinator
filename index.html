<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#130406" />
    <meta name="description" content="Назови имя, изложи причину — и пусть Проклимёт выберет одно из двадцати проклятий." />
    <title>Проклимёт</title>
    <link rel="stylesheet" href="./app/globals.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell" id="form-screen">
      <div class="noise"></div>
      <div class="ritual-content">
        <section class="intro">
        <div class="ritual-mark" aria-hidden="true"><span>⛧</span></div>
        <h1>Прокляни</h1>
        <p class="description">Назови имя, изложи причину — и пусть случай решит, какое мелкое проклятие настигнет виновного.</p>
        </section>
        <form class="curse-form" id="curse-form">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" maxlength="60" required autocomplete="off" placeholder="Кого проклинаем?" />
          <div class="label-row"><label for="reason">За что проклинаю</label><span id="reason-counter">0/300</span></div>
          <textarea id="reason" name="reason" rows="5" maxlength="300" required placeholder="Опиши проступок во всех подробностях…"></textarea>
          <button class="curse-button" type="submit"><span>Проклинаю</span></button>
        </form>
      </div>
      <footer>Никакой магии. Только заслуженное облегчение.</footer>
    </main>

    <main class="result-screen hidden" id="result-screen">
      <div class="noise"></div><span class="orbit orbit-one" aria-hidden="true"></span><span class="orbit orbit-two" aria-hidden="true"></span>
      <section class="result-card" aria-live="polite">
        <p class="result-kicker" id="result-kicker"></p>
        <div class="sigil" aria-hidden="true"><img id="result-symbol" src="./app/ram-skull.png" alt="" /></div>
        <h1 id="result-title" tabindex="-1"></h1>
        <p class="target" id="result-name"></p><p class="reason-label">за то, что</p><p class="reason" id="result-reason"></p>
        <div class="verdict"><span>Приговор</span><p id="result-verdict"></p></div>
        <button class="secondary-button" id="reset-button" type="button">Проклясть ещё кого-нибудь</button>
        <div class="result-actions">
          <button class="secondary-button" id="pardon-button" type="button"><img class="button-wing wing-left" src="./app/angel-wings.png" alt="" /><span>Помиловать</span><img class="button-wing wing-right" src="./app/angel-wings.png" alt="" /></button>
          <button class="secondary-button" id="share-button" type="button">Поделиться</button>
        </div>
        <p class="action-status" id="action-status" role="status"></p>
        <div id="share-fallback" class="share-fallback hidden">
          <a id="download-card" download>Сохранить картинку</a>
          <a id="telegram-share" target="_blank" rel="noopener">Открыть Telegram</a>
          <p>Сохрани картинку и прикрепи её в выбранном чате.</p>
        </div>
      </section>
    </main>
  </body>
</html>
